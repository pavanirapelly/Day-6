<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Object</title>
</head>
<body>
    <h1>JS Object Demo</h1>
    <script>
       
            var a=10
            a=20
            var a=30
            console.log("value of a ",a)
            document.write("<br>value of a :",a)

            let b=10
            b=20
            // let b=30
            console.log("value of b ",b)
            document.write(" <br>value of b :",b)

            const c=10
            // c=20
            console.log("value of c ",c)
            document.write(" <br> value of c :",c)


            const student={
                name:"pavani",
                email:"pavani@gmail.com",
                age:21
            }
            console.log(student.name)
            document.write("<br> Student Name: ",student.name)
            document.write("<br> Email:",student.email)
            document.write("<br> Age:",student.age)

 </script>
</body>
</html>
